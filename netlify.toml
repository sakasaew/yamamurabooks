[build]
  publish = "."

# 末尾スラッシュURLを直接コンテンツで返す（リダイレクトなし＝ループ不可能）
# Netlifyが /news → /news/ にリダイレクトしてしまう場合でも
# /news/ でコンテンツを直接返すため無限ループが発生しない
[[redirects]]
  from = "/news/"
  to   = "/news.html"
  status = 200
  force  = true

[[redirects]]
  from = "/access/"
  to   = "/access.html"
  status = 200
  force  = true

