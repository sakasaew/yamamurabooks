.tb-list{list-style:none;margin:0;padding:0;border-top:1px solid #e2e8f0}
.tb-list li{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:baseline;padding:.65rem .1rem;border-bottom:1px solid #e2e8f0}
.tb-title{font-weight:500;line-height:1.5;word-break:break-word}

.tb-price{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}

const yen = n => n.toLocaleString("ja-JP") + "円";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel = document.getElementById("course"), out = document.getElementById("result"), desc = document.getElementById("desc");
for (const p of DATA.patterns) {
  const o = document.createElement("option");
  o.value = p.code; o.textContent = p.slip;
  sel.appendChild(o);
}
if (DATA.select.single) { document.getElementById("selbox").hidden = true; }
else { document.getElementById("sel-label").textContent = DATA.select.label; document.getElementById("sel-hint").textContent = DATA.select.hint; }
document.getElementById("pay").innerHTML = DATA.payLines.map(t => "<li>" + esc(t) + "</li>").join("");

function list(items) {
  return '<ul class="tb-list">' + items.map(it =>
    '<li><div class="tb-title">' + (it.laterDelivery ? '<span class="tb-star" aria-label="後日配布">※</span>' : "") + esc(it.title) +
    '<span class="tb-meta">' + esc([it.pub, it.num].filter(Boolean).join("　")) + '</span></div>' +
    '<div class="tb-price">' + yen(it.price) + "</div></li>").join("") + "</ul>";
}
function sum(items) { return items.reduce((a, it) => a + it.price, 0); }

function render(code) {
  const p = DATA.patterns.find(x => x.code === code);
  if (!p) { out.innerHTML = '<p class="tb-empty" id="empty">コースを選ぶと、教材と金額が表示されます。</p>'; desc.hidden = true; sel.value = ""; return; }
  sel.value = p.code;
  desc.hidden = false;
  desc.innerHTML = '<b>' + esc(p.slip) + '</b>　' + esc(p.desc);
  const its = p.items.map(id => DATA.items[id]);
  const tb = its.filter(i => i.kubun === "教科書"), sb = its.filter(i => i.kubun === "副教材");
  const ship = p.ship ? DATA.ship : 0;
  const total = sum(tb) + sum(sb) + ship;
  let h = "";
  h += '<h2 class="tb-h2">教科書（' + tb.length + '冊）</h2>' + list(tb);
  h += '<h2 class="tb-h2">副教材（' + sb.length + '点）</h2>' + list(sb);
  h += '<p class="tb-note">' + esc(DATA.starNote) + "</p>";
  h += '<div class="tb-sum"><dl>' +
       "<dt>教科書 小計</dt><dd id='sub-tb'>" + yen(sum(tb)) + "</dd>" +
       "<dt>副教材 小計</dt><dd id='sub-sb'>" + yen(sum(sb)) + "</dd>" +
       "<dt>送料</dt><dd id='sub-ship'>" + (ship ? yen(ship) : "—") + "</dd></dl>" +
       '<div class="tb-total"><span class="font-bold">合計金額</span><b id="total" data-total="' + total + '">' + yen(total) + "</b></div>" +
       '<p class="tb-note" style="margin-top:.4rem">合計金額は払込票の金額と同じです。金額はすべて税込です（教科書は非課税）。</p></div>';
  if (DATA.laterSale.length) {
    h += '<div class="tb-later"><h2 class="tb-h2" style="margin-top:0">後日販売（合計金額には含まれません）</h2>' + list(DATA.laterSale) + "</div>";
  }
  out.innerHTML = h;
}
function fromHash() {
  const c = decodeURIComponent(location.hash.replace(/^#/, "")).toUpperCase().replace(/^[A-Z]{2}[0-9]-/, "");
  render(c);
}
sel.addEventListener("change", () => {
  if (sel.value) history.replaceState(null, "", "#" + sel.value); else history.replaceState(null, "", location.pathname);
  render(sel.value);
});
window.addEventListener("hashchange", fromHash);
if (DATA.select.single) render(DATA.patterns[0].code); else fromHash();
